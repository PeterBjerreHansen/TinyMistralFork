[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-mistral"
version = "0.2.0"
description = "A small, auditable PyTorch reference implementation for M4-ai/TinyMistral-248M-v3."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
  "torch>=2.5",
  "safetensors>=0.4",
]

[project.optional-dependencies]
io = [
  "huggingface_hub>=0.25",
  "tokenizers>=0.20",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "huggingface_hub>=0.25",
  "tokenizers>=0.20",
  "transformers==4.45.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the real TinyMistral checkpoint and optional dependencies",
]
